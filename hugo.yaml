baseurl: "https://felixhelbing.de/"
languageCode: "de"
title: "FelixHelbing.de"
buildFuture: true
enableRobotsTXT: true
disableHugoGeneratorInject: true
disableKinds: ["RSS", "sitemap", "section"]
theme: tokyo-komae-hugo
taxonomies:
  tag: tags
permalinks:
  page:
    posts: /:slug/
    encrypted: /:slug/
params:
  description: "Felix Helbing Blog"
  robotsDisallow: /
  footer:
    - links:
        - name: Inhalt
          url: /inhalt/
        - name: Octocy GmbH
          url: /octocy/
    - links:
        - name: GitHub
          url: https://github.com/felixhelbing/
          external: true
        - name: LinkedIn
          url: https://www.linkedin.com/in/felix-helbing/
          external: true
    - links:
        - name: Impressum
          url: /imprint/
        - name: Datenschutzerklärung
          url: /privacy-policy/
    - links:
        - name: Themen
          url: /tags/
markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
