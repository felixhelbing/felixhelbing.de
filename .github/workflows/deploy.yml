name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      - run: hugo --minify

      - run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.FTP_PASSWORD }}" \
            rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 50001" \
            ./public/ \
            ${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:felixhelbing.de/
